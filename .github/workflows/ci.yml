name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-python-tests:
    name: Python FastAPI & AI Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_python/requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend_python
        run: |
          python -m pytest backend_python/app/tests -v


  frontend-react-build:
    name: React Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Compile TypeScript & Production Web Assets
        run: npm run build
