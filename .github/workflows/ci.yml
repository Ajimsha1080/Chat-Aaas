name: CoarAI Enterprise CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-lint:
    name: Secret Scanning & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: TypeScript Validation
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        run: npm test

  backend-tests:
    name: Backend Pytest, Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend_python/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_python/requirements.txt

      - name: Python Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r backend_python/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Code Linting (Ruff)
        working-directory: backend_python
        run: |
          ruff check .

      - name: Static Type Checking (Mypy)
        working-directory: backend_python
        run: |
          mypy app

      - name: Run Pytest Suite
        env:
          ENVIRONMENT: development
          JWT_SECRET: ci-test-token-secret-must-be-at-least-32-chars-long
          PYTHON_AI_INTERNAL_SECRET: ci-test-internal-secret-must-be-at-least-32-chars
          ENCRYPTION_KEY: ci-test-encryption-key-must-be-at-least-32-chars-length
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python -m pytest backend_python/app/tests -v

  docker-build:
    name: Docker Production Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: coarai-frontend:test

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_python
          file: ./backend_python/Dockerfile
          push: false
          tags: coarai-backend:test
