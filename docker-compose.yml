services:
  backend:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: aaas-backend
    restart: always
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://aaas_admin:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/aaas_production
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-insecure_default_dev_jwt_secret_must_be_32_bytes_long}
      - PYTHON_AI_INTERNAL_SECRET=${PYTHON_AI_INTERNAL_SECRET:-insecure_default_dev_internal_secret_32_bytes}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-insecure_default_dev_encryption_key_32_bytes_len}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000,http://${SERVER_HOST:-127.0.0.1},https://${SERVER_HOST:-127.0.0.1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
      - CUSTOM_LLM_API_URL=${CUSTOM_LLM_API_URL:-https://api.sarvam.ai/v1/chat/completions}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-sarvam-105b-conversations}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:8000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aaas-network

  worker:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: aaas-worker
    restart: always
    command: ["python", "-m", "app.workers.worker_runner"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://aaas_admin:${POSTGRES_PASSWORD:-secret_password}@postgres:5432/aaas_production
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-insecure_default_dev_jwt_secret_must_be_32_bytes_long}
      - PYTHON_AI_INTERNAL_SECRET=${PYTHON_AI_INTERNAL_SECRET:-insecure_default_dev_internal_secret_32_bytes}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-insecure_default_dev_encryption_key_32_bytes_len}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - CUSTOM_LLM_API_KEY=${CUSTOM_LLM_API_KEY:-}
      - CUSTOM_LLM_API_URL=${CUSTOM_LLM_API_URL:-https://api.sarvam.ai/v1/chat/completions}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-sarvam-105b-conversations}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - aaas-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aaas-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - aaas-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aaas-postgres
    restart: always
    environment:
      - POSTGRES_USER=aaas_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret_password}
      - POSTGRES_DB=aaas_production
    # Database port kept internal to aaas-network for production security
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aaas_admin -d aaas_production']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aaas-network

  redis:
    image: redis:7-alpine
    container_name: aaas-redis
    restart: always
    # Redis port kept internal to aaas-network for production security
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aaas-network

volumes:
  postgres_data:
  redis_data:

networks:
  aaas-network:
    driver: bridge
