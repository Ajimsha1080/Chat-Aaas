version: '3.8'

services:
  backend:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: aaas-backend
    restart: always
    ports:
      - '8000:8000'
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aaas_admin:secret_password@postgres:5432/aaas_production
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-tenant-sessions-change-in-prod}
      - PYTHON_AI_INTERNAL_SECRET=${PYTHON_AI_INTERNAL_SECRET:-secret-internal-key-change-in-prod}
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - aaas-network

  worker:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
    container_name: aaas-worker
    restart: always
    command: ["python", "-m", "app.workers.worker_runner"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://aaas_admin:secret_password@postgres:5432/aaas_production
      - REDIS_URL=redis://redis:6379/0
      - PYTHON_AI_INTERNAL_SECRET=${PYTHON_AI_INTERNAL_SECRET:-secret-internal-key-change-in-prod}
    depends_on:
      - backend
      - postgres
      - redis
    networks:
      - aaas-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aaas-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - aaas-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aaas-postgres
    restart: always
    environment:
      - POSTGRES_USER=aaas_admin
      - POSTGRES_PASSWORD=secret_password
      - POSTGRES_DB=aaas_production
    # Database port kept internal to aaas-network for production security
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aaas_admin -d aaas_production']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aaas-network

  redis:
    image: redis:7-alpine
    container_name: aaas-redis
    restart: always
    # Redis port kept internal to aaas-network for production security
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aaas-network

volumes:
  postgres_data:
  redis_data:

networks:
  aaas-network:
    driver: bridge
