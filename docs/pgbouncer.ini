;; ====================================================================
;; CoarAI Enterprise PgBouncer Configuration Template
;; Provides high-throughput connection pooling & transaction multiplexing
;; ====================================================================

[databases]
coarai_primary = host=127.0.0.1 port=5432 dbname=chat_aaas auth_user=postgres
coarai_read_replica = host=127.0.0.1 port=5433 dbname=chat_aaas auth_user=postgres

[pgbouncer]
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Pool Configuration
pool_mode = transaction
max_client_conn = 5000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5.0
max_db_connections = 100

;; Connection Hygiene
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 300
query_timeout = 60.0
